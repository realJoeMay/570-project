[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utils", "utils.*"]
namespaces = false

[project]
name = "parish-ministry-benchmark"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "ollama",
    "openai",
    "pydantic>=2",
]
